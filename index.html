<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animal Career Quest — A2+/Low B1</title>
<style>
:root{
  --bg:#f4f7f8; --card:#ffffff; --ink:#17252f; --muted:#66757d;
  --accent:#1d6b68; --accent2:#d9eee9; --gold:#d69b35; --danger:#b85c4a;
  --line:#dbe3e5; --shadow:0 12px 30px rgba(20,40,45,.08);
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#eef5f4,#f8f6f0);color:var(--ink)}
.app{max-width:1050px;margin:auto;padding:24px}
.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:18px}
.brand{font-weight:800;letter-spacing:.04em;color:var(--accent)}
.progress{font-size:13px;color:var(--muted)}
.bar{height:7px;background:#dfe7e7;border-radius:99px;overflow:hidden;margin-bottom:28px}
.fill{height:100%;background:var(--accent);width:16%;transition:.35s}
.screen{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:34px}
.kicker{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--accent);font-weight:800}
h1{font-size:42px;line-height:1.05;margin:10px 0 12px}
h2{font-size:29px;margin:7px 0 12px}
h3{margin:0 0 7px}
p{line-height:1.6}
.lead{font-size:18px;color:#43545c;max-width:760px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:22px 0}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}
.card,.choice,.profile,.scenario{border:1px solid var(--line);border-radius:17px;background:#fff;padding:18px;transition:.2s}
.card:hover,.choice:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(20,40,45,.07)}
.choice{cursor:pointer;text-align:left;width:100%;font:inherit;color:var(--ink)}
.choice.selected{border:2px solid var(--accent);background:var(--accent2)}
.choice.correct{border:2px solid #3b8b68;background:#edf8f2}
.choice.wrong{border:2px solid var(--danger);background:#fff1ee}
.icon{font-size:30px;margin-bottom:8px}
.small{font-size:13px;color:var(--muted)}
.tag{display:inline-block;padding:5px 9px;border-radius:99px;background:#edf2f2;font-size:12px;margin:3px}
button.primary,button.secondary{border:0;border-radius:12px;padding:13px 18px;font-weight:750;cursor:pointer;font-size:15px}
button.primary{background:var(--accent);color:white}
button.secondary{background:#e8eeee;color:var(--ink)}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px;flex-wrap:wrap}
.feedback{margin-top:16px;padding:14px 16px;border-radius:13px;background:#f1f5f5;border-left:4px solid var(--accent)}
textarea{width:100%;min-height:130px;border:1px solid var(--line);border-radius:14px;padding:15px;font:inherit;resize:vertical}
select{padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit;background:white}
.score{font-size:18px;font-weight:800;color:var(--accent)}
.pillrow{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}
.timeline{display:flex;gap:8px;margin:10px 0 25px}
.dot{height:9px;flex:1;border-radius:20px;background:#dce4e4}.dot.on{background:var(--accent)}
.callout{background:#f7f2e7;border:1px solid #eadfc6;border-radius:16px;padding:18px;margin:18px 0}
@media(max-width:760px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}h1{font-size:34px}.screen{padding:24px}}
@media(max-width:480px){.cards{grid-template-columns:1fr}.app{padding:12px}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">ANIMAL CAREER QUEST</div>
    <div class="progress" id="progressText">Mission 1 of 6</div>
  </div>
  <div class="bar"><div class="fill" id="fill"></div></div>
  <main class="screen" id="screen"></main>
</div>

<script>
const careers = [
 {name:"Dog handler",icon:"🐕",work:"works closely with dogs",fit:["hands-on","outdoors","animals"]},
 {name:"Veterinarian",icon:"🩺",work:"cares for sick or injured animals",fit:["hands-on","science","care"]},
 {name:"Zookeeper",icon:"🦒",work:"looks after animals in a zoo",fit:["outdoors","different animals","care"]},
 {name:"Wildlife photographer",icon:"📷",work:"takes photos of animals in the wild",fit:["outdoors","creative","patience"]},
 {name:"Marine biologist",icon:"🌊",work:"studies animals that live in the sea",fit:["science","marine","research"]},
 {name:"Horse trainer",icon:"🐎",work:"trains and works closely with horses",fit:["hands-on","patience","outdoors"]},
 {name:"Zoologist",icon:"🔬",work:"studies animals scientifically",fit:["science","research","different animals"]},
 {name:"Snake milker",icon:"🐍",work:"takes venom from snakes for medical use",fit:["careful","brave","hands-on"]}
];

const profiles = [
 {name:"Holly",info:"18 • loves small animals • has always had pets • good exam results • prefers practical study",best:["Dog handler","Veterinarian","Horse trainer"]},
 {name:"Daniel",info:"Enjoys science, is very patient, prefers research to direct care, and is fascinated by marine life.",best:["Marine biologist","Zoologist"]},
 {name:"Maya",info:"Loves being outdoors, has a creative side, and would rather observe animals than work with them directly.",best:["Wildlife photographer"]}
];

let stage=0, score=0, selected=[], current=0;

function update(){
  document.getElementById("progressText").textContent = stage===0 ? "Welcome" : `Mission ${Math.min(stage,6)} of 6`;
  document.getElementById("fill").style.width = (stage===0?8:Math.min(stage,6)/6*100)+"%";
}
function setScreen(html){document.getElementById("screen").innerHTML=html; update();}

function home(){
 stage=0; score=0; current=0;
 setScreen(`<div class="kicker">A2+ / Low B1 • Adults</div>
 <h1>Could you choose the right animal career?</h1>
 <p class="lead">You are part of a career advisory team. Your job is not to find the “perfect” answer. You must compare information, make decisions, explain your reasoning and sometimes change your mind.</p>
 <div class="grid">
   <div class="card"><b>🔎 Investigate</b><p>Explore what different careers actually involve.</p></div>
   <div class="card"><b>🧠 Analyze</b><p>Match people, skills and working conditions.</p></div>
   <div class="card"><b>⚖️ Decide</b><p>Choose the best option when there is no obvious answer.</p></div>
   <div class="card"><b>💬 Defend</b><p>Give reasons and challenge another opinion.</p></div>
 </div>
 <div class="callout"><b>Teacher tip:</b> Play in pairs or small teams. Students should say their reason before clicking an answer.</div>
 <div class="actions"><button class="primary" onclick="mission1()">Start the quest →</button></div>`);
}

function mission1(){
 stage=1;
 setScreen(`<div class="kicker">Mission 1 • Career Lab</div>
 <h2>Build the career map</h2>
 <p>Before advising anyone, your team needs to understand the jobs. Choose <b>four careers</b> that seem the most interesting. Then compare your choices with another team.</p>
 <div class="cards">${careers.map((c,i)=>`<button class="choice" id="c${i}" onclick="toggleCareer(${i})"><div class="icon">${c.icon}</div><b>${c.name}</b><p class="small">${c.work}</p></button>`).join("")}</div>
 <div class="feedback" id="mapFeedback">Selected: <span id="count">0</span>/4</div>
 <div class="actions"><button class="primary" onclick="mission1Next()">Continue →</button></div>`);
}
function toggleCareer(i){
 const el=document.getElementById("c"+i);
 if(selected.includes(i)){selected=selected.filter(x=>x!==i);el.classList.remove("selected")}
 else if(selected.length<4){selected.push(i);el.classList.add("selected")}
 document.getElementById("count").textContent=selected.length;
}
function mission1Next(){
 if(selected.length<4){alert("Choose four careers first.");return}
 stage=2; profileRound(0);
}
function profileRound(i){
 current=i;
 const p=profiles[i];
 setScreen(`<div class="kicker">Mission 2 • Career Advisors</div>
 <h2>Who is this career for?</h2>
 <div class="profile"><h3>${p.name}</h3><p>${p.info}</p></div>
 <p><b>Choose the best recommendation.</b> There may be more than one reasonable answer, but choose the strongest match and be ready to explain it.</p>
 <div class="grid">${careers.map((c,idx)=>`<button class="choice" onclick="chooseProfile(${idx},${i},this)">${c.icon} <b>${c.name}</b><div class="small">${c.work}</div></button>`).join("")}</div>
 <div id="profileFeedback"></div>`);
}
function chooseProfile(idx,pi,el){
 document.querySelectorAll(".choice").forEach(x=>x.classList.remove("selected","correct","wrong"));
 el.classList.add(profiles[pi].best.includes(careers[idx].name)?"correct":"wrong");
 const good=profiles[pi].best.includes(careers[idx].name);
 if(good) score+=1;
 document.getElementById("profileFeedback").innerHTML=`<div class="feedback"><b>${good?"Good match!":"Not the strongest match."}</b> ${profiles[pi].name}'s profile suggests: ${profiles[pi].best.join(", ")}. <br><span class="small">Now explain why your choice fits.</span></div>
 <div class="actions"><button class="primary" onclick="${pi<profiles.length-1?`profileRound(${pi+1})`:`mission3()`}">Next →</button></div>`;
}

const decisions=[
 {title:"The nervous dog",text:"A dog becomes very nervous around strangers. You are choosing between two applicants. Applicant A has lots of experience but gets impatient. Applicant B has less experience but is calm and patient.",opts:["Choose A because experience is more important.","Choose B because patience may be more important for this situation.","Reject both applicants."],ans:1,why:"For a nervous animal, patience and calm behavior can be especially important. Experience still matters, but the situation changes the priority."},
 {title:"The wildlife assignment",text:"You are planning a wildlife photography trip. You can take a great camera with limited battery, or a basic camera with extra batteries. The animals are difficult to find and the trip may last all day.",opts:["Take the great camera. Image quality is everything.","Take the basic camera with extra batteries because you may need it for a long day.","Take both and hope they are not too heavy."],ans:1,why:"The second option balances the working conditions with the goal. The best equipment is not always the most useful choice."},
 {title:"The marine research problem",text:"A marine research team needs someone who is good at science, comfortable in water and able to work carefully with data. One applicant loves the ocean but dislikes science.",opts:["Choose the applicant because passion is enough.","Choose the applicant only if they can improve their science skills.","Choose nobody; marine work is impossible without perfect skills."],ans:1,why:"The second option recognizes both strengths and a development area. Careers can involve learning and improving."}
];
function mission3(){
 stage=3; decisionRound(0);
}
function decisionRound(i){
 current=i; const d=decisions[i];
 setScreen(`<div class="kicker">Mission 3 • Decision Room</div>
 <h2>${d.title}</h2>
 <p class="lead">${d.text}</p>
 <div>${d.opts.map((x,n)=>`<button class="choice" style="margin:7px 0" onclick="chooseDecision(${n},${i},this)">${String.fromCharCode(65+n)}. ${x}</button>`).join("")}</div>
 <div id="decisionFeedback"></div>`);
}
function chooseDecision(n,i,el){
 document.querySelectorAll(".choice").forEach(x=>x.classList.remove("selected","correct","wrong"));
 const d=decisions[i],good=n===d.ans;
 el.classList.add(good?"correct":"wrong"); if(good)score++;
 document.getElementById("decisionFeedback").innerHTML=`<div class="feedback"><b>${good?"Strong decision.":"Think again."}</b><br>${d.why}<br><br><b>Discuss:</b> Would you make the same decision? What could go wrong with the other options?</div>
 <div class="actions"><button class="primary" onclick="${i<decisions.length-1?`decisionRound(${i+1})`:`mission4()`}">Next →</button></div>`;
}

function mission4(){
 stage=4;
 setScreen(`<div class="kicker">Mission 4 • Real Case</div>
 <h2>Holly needs advice</h2>
 <div class="callout"><b>Holly is 18.</b> She loves small animals, has always had pets and has good exam results. However, she prefers a practical course to an academic one.</div>
 <p>Her family asks your team for advice. You can recommend <b>one career</b>, <b>two careers</b>, or tell Holly to explore more before deciding.</p>
 <div class="grid">
   ${["Dog handler","Veterinarian","Horse trainer","Zoologist"].map((x,i)=>`<button class="choice" onclick="chooseHolly(${i},this)">${["🐕","🩺","🐎","🔬"][i]} <b>${x}</b><div class="small">${careers.find(c=>c.name===x).work}</div></button>`).join("")}
 </div>
 <div id="hollyFeedback"></div>`);
}
function chooseHolly(i,el){
 document.querySelectorAll(".choice").forEach(x=>x.classList.remove("selected"));
 el.classList.add("selected");
 const name=["Dog handler","Veterinarian","Horse trainer","Zoologist"][i];
 const fit=name==="Dog handler"||name==="Horse trainer";
 document.getElementById("hollyFeedback").innerHTML=`<div class="feedback"><b>Your recommendation: ${name}</b><br>
 ${fit?"This fits Holly's preference for practical work particularly well.":"This could fit some of Holly's interests, but her preference for practical study should make you think carefully."}
 <br><br><b>Team challenge:</b> Can you give <u>two reasons</u> for your recommendation and <u>one possible disadvantage</u>?</div>
 <div class="actions"><button class="primary" onclick="mission5()">Next →</button></div>`;
}

function mission5(){
 stage=5;
 setScreen(`<div class="kicker">Mission 5 • Your Career Profile</div>
 <h2>Design your ideal animal job</h2>
 <p>Imagine you could create your own job working with animals. Choose the conditions that matter most to you, then prepare a short pitch.</p>
 <div class="grid">
   <div class="card"><b>Animals</b><p><select id="animal"><option>small animals</option><option>large animals</option><option>marine animals</option><option>wild animals</option><option>different animals</option></select></p></div>
   <div class="card"><b>Workplace</b><p><select id="place"><option>outdoors</option><option>in a laboratory</option><option>in a zoo</option><option>at an animal hospital</option><option>in different locations</option></select></p></div>
   <div class="card"><b>Contact</b><p><select id="contact"><option>work closely with animals</option><option>observe animals from a distance</option><option>study animals</option><option>take care of animals</option></select></p></div>
   <div class="card"><b>Priority</b><p><select id="priority"><option>helping animals</option><option>learning new things</option><option>being outdoors</option><option>having a practical job</option><option>doing scientific research</option></select></p></div>
 </div>
 <div class="callout"><b>Your pitch:</b> “If I were going to work with animals, I would like to… because… However, I wouldn't like to…”</div>
 <textarea id="pitch" placeholder="Write a few notes before you speak. Don't write a full paragraph."></textarea>
 <div class="actions"><button class="primary" onclick="mission6()">Final challenge →</button></div>`);
}
function mission6(){
 stage=6;
 setScreen(`<div class="kicker">Final Mission • Career Panel</div>
 <h2>Convince the panel</h2>
 <p class="lead">Your team must choose <b>one animal career</b> to recommend to a person who says: “I love animals, but I don't know what kind of job would suit me.”</p>
 <div class="grid">
   <div class="card"><h3>Step 1</h3><p>Choose a career from the map.</p></div>
   <div class="card"><h3>Step 2</h3><p>Give two reasons based on the person's interests or qualities.</p></div>
   <div class="card"><h3>Step 3</h3><p>Mention one possible difficulty or disadvantage.</p></div>
   <div class="card"><h3>Step 4</h3><p>Ask another team: “Would you choose the same career? Why / why not?”</p></div>
 </div>
 <div class="callout"><b>Useful language</b><br>
 “I think ___ would be a good choice because…”<br>
 “The main advantage is…”<br>
 “However, one possible problem is…”<br>
 “I agree / I’m not sure because…”<br>
 “If I were in that situation, I would…”</div>
 <div class="score">Quest score: ${score} points</div>
 <div class="actions"><button class="secondary" onclick="home()">Play again</button></div>`);
}
home();
</script>
</body>
</html>
